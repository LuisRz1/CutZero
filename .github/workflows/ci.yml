name: CutZero CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

concurrency:
  group: cutzero-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DARTCV_CACHE_DIR: ${{ github.workspace }}/.dartcv-cache
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android native toolchain
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          'platforms;android-36'
          'ndk;28.2.13676358'
          'cmake;3.22.1'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - uses: actions/cache@v6
        with:
          path: .dartcv-cache
          key: dartcv-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug --target-platform android-arm64 --split-per-abi
      - uses: actions/upload-artifact@v7
        with:
          name: cutzero-android-debug
          path: build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          if-no-files-found: error

  verify-ios:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DARTCV_CACHE_DIR: ${{ github.workspace }}/.dartcv-cache
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - uses: actions/cache@v6
        with:
          path: .dartcv-cache
          key: dartcv-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
      - run: flutter pub get
      - run: flutter build ios --debug --no-codesign
